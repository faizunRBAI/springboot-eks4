        \ get job db-migrate -n \"$NAMESPACE\" -o jsonpath='{.status.succeeded}' 2>/dev/null\
        \ || true)\"\n  FAILED=\"$(kubectl get job db-migrate -n \"$NAMESPACE\" -o\
        \ jsonpath='{.status.failed}' 2>/dev/null || true)\"\n  if [ \"${SUCCEEDED:-}\"\
        \ = \"1\" ]; then OUTCOME=\"succeeded\"; break; fi\n  if [ -n \"${FAILED:-}\"\
        \ ] && [ \"${FAILED}\" != \"0\" ]; then OUTCOME=\"failed\"; break; fi\n  sleep\
