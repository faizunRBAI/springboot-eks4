        \ continue ;;\n  esac\n  sed -e \"s|%%NAMESPACE%%|${NAMESPACE}|g\" \\\n  \
        \    -e \"s|%%IMAGE_TAG%%|${IMAGE_TAG}|g\" \\\n      -e \"s|%%IMAGE%%|${IMAGE}|g\"\
        \ \\\n      \"$manifest\" | kubectl apply -f -\ndone\n"
    - name: Wait for the rollout
      run: "set -uo pipefail\nNS=\"${{ secrets.PROJECT_NAME }}\"\nif kubectl rollout\
        \ status deployment/api --namespace \"$NS\" --timeout=10m; then\n  exit 0\n\
        fi\necho \"--- pods ---\"\nkubectl get pods -n \"$NS\" -l app.kubernetes.io/name=api\
        \ -o wide || true\necho \"--- why the pods are not ready ---\"\nkubectl describe\
        \ pods -n \"$NS\" -l app.kubernetes.io/name=api \\\n  | grep -A 12 -E \"Conditions:|Events:|State:|Last\
        \ State:\" || true\necho \"--- application log ---\"\nkubectl logs -n \"$NS\"\
        \ -l app.kubernetes.io/name=api --tail=100 --all-containers || true\necho\
        \ \"--- namespace events ---\"\nkubectl get events -n \"$NS\" --sort-by=.lastTimestamp\
        \ | tail -25 || true\necho \"::error::The Deployment never became ready. A\
        \ pod that answers /health but fails /ready is usually the database connection\
        \ \u2014 check the application log above.\"\nexit 1\n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Wait for the load balancer
      run: "set -euo pipefail\nNAMESPACE=\"${{ secrets.PROJECT_NAME }}\"\naws eks\
        \ update-kubeconfig --name \"${NAMESPACE}-eks\" --region \"$AWS_REGION\"\n\
        HOST=\"\"\nfor _ in $(seq 1 40); do\n  # A network load balancer reports a\
        \ hostname; an IP-target load\n  # balancer reports .ip. Read both, or the\
        \ wait times out on a service\n  # that is actually ready.\n  HOST=\"$(kubectl\
        \ get svc api -n \"$NAMESPACE\" \\\n    -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'\
        \ 2>/dev/null || true)\"\n  if [ -z \"$HOST\" ]; then\n    HOST=\"$(kubectl\
        \ get svc api -n \"$NAMESPACE\" \\\n      -o jsonpath='{.status.loadBalancer.ingress[0].ip}'\
        \ 2>/dev/null || true)\"\n  fi\n  if [ -n \"$HOST\" ]; then break; fi\n  sleep\
        \ 15\ndone\nif [ -z \"$HOST\" ]; then\n  echo \"The load balancer never reported\
        \ an address after 10 minutes.\"\n  echo \"--- service ---\"\n  kubectl describe\
        \ svc api -n \"$NAMESPACE\" || true\n  echo \"--- events (the cloud controller\
        \ reports subnet and quota problems here) ---\"\n  kubectl get events -n \"\
        $NAMESPACE\" --sort-by=.lastTimestamp | tail -25 || true\n  echo \"::error::No\
        \ load balancer address. Usual causes: the public subnets lost their kubernetes.io/role/elb\
        \ tag, or the account is at its load balancer quota.\"\n  exit 1\nfi\necho\
        \ \"APP_URL=http://${HOST}\" >> \"$GITHUB_ENV\"\n# The platform learns a project's\
        \ public address by scraping these exact\n# shapes out of the CI log \u2014\
        \ there is no API call for it \u2014 and it only\n# shows the \"open the app\"\
        \ link once it has one.\necho \"Load balancer address: ${HOST}\"\necho \"\
        alb_hostname = \\\"${HOST}\\\"\"\necho \"Live URL: http://${HOST}\"\necho\
        \ \"Application is available at: http://${HOST}\"\necho \"url=http://${HOST}\"\
        \n"
    - name: Health check
      run: "set -euo pipefail\nfor i in $(seq 1 40); do\n  CODE=\"$(curl -s -o /dev/null\
        \ -w '%{http_code}' --max-time 10 \"${APP_URL}/health\" 2>/dev/null || true)\"\
        \n  if [ \"$CODE\" = \"200\" ]; then\n    echo \"Service is healthy at ${APP_URL}\"\
        \n    echo \"Live URL: ${APP_URL}\"\n    curl -s --max-time 10 \"${APP_URL}/api/info\"\
        \ || true\n    echo\n    exit 0\n  fi\n  case \"${CODE}\" in\n    000|\"\"\
        ) echo \"  attempt ${i}/40: load balancer not answering yet (DNS or target\
        \ registration)\" ;;\n    *)      echo \"  attempt ${i}/40: HTTP ${CODE} from\
        \ /health\" ;;\n  esac\n  sleep 15\ndone\necho \"The service never returned\
        \ 200 from /health in 10 minutes.\"\necho \"--- pods ---\"\nkubectl get pods\
        \ -n \"${{ secrets.PROJECT_NAME }}\" -o wide || true\necho \"--- application\
        \ log ---\"\nkubectl logs -n \"${{ secrets.PROJECT_NAME }}\" -l app.kubernetes.io/name=api\
        \ --tail=100 || true\necho \"--- endpoints (empty means no pod passed its\
        \ readiness probe) ---\"\nkubectl get endpoints api -n \"${{ secrets.PROJECT_NAME\
        \ }}\" -o wide || true\necho \"::error::The load balancer answered but /health\
        \ never returned 200. Check the application log above, and whether the readiness\
        \ probe on /ready is passing.\"\nexit 1\n"
  notify:
    runs-on: ubuntu-latest
    needs:
    - verify
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Deployment summary
      run: "set -uo pipefail\nNS=\"${{ secrets.PROJECT_NAME }}\"\naws eks update-kubeconfig\
        \ --name \"${NS}-eks\" --region \"$AWS_REGION\" >/dev/null 2>&1 || true\n\
        HOST=\"$(kubectl get svc api -n \"$NS\" \\\n  -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'\
        \ 2>/dev/null || true)\"\n[ -n \"$HOST\" ] || HOST=\"$(kubectl get svc api\
        \ -n \"$NS\" \\\n  -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null\
        \ || true)\"\n{\n  echo \"### Deployment complete\"\n  echo \"\"\n  if [ -n\
        \ \"$HOST\" ]; then\n    echo \"**Application:** <http://${HOST}>\"\n    echo\
        \ \"\"\n    echo \"> A newly created load balancer can take a few more minutes\
        \ to\"\n    echo \"> resolve from outside AWS. If the link does not open yet,\
        \ it is\"\n    echo \"> DNS propagation, not the deploy \u2014 the health\
        \ check above\"\n    echo \"> already reached it.\"\n    echo \"\"\n  fi\n\
        \  echo \"| | |\"\n  echo \"|---|---|\"\n  echo \"| Cluster | \\`${NS}-eks\\\
        ` |\"\n  echo \"| Namespace | \\`${NS}\\` |\"\n  echo \"| Image tag | \\`${GITHUB_SHA::12}\\\
        ` |\"\n  echo \"| Actuator | \\`http://${HOST}/actuator/health\\` |\"\n  echo\
        \ \"\"\n  echo \"Re-read the address any time with:\"\n  echo '```'\n  echo\
        \ \"aws eks update-kubeconfig --name ${NS}-eks --region ${AWS_REGION}\"\n\
        \  echo \"kubectl get svc api -n ${NS}\"\n  echo '```'\n  echo \"\"\n  echo\
        \ \"Security artefacts for this run: Semgrep SAST, Gitleaks, licence report,\"\
        \n  echo \"dependency SBOM and image SBOM are attached to the workflow run.\"\
        \n} >> \"$GITHUB_STEP_SUMMARY\"\n[ -n \"$HOST\" ] && echo \"Live URL: http://${HOST}\"\
        \nexit 0\n"
